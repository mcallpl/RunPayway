<VirtualHost *:80>
  ServerName runpayway.peoplestar.com
  ServerAlias runpayway.peoplestar.com

  RewriteEngine On
  RewriteCond %{HTTPS} !=on
  RewriteRule ^/?(.*) https://%{SERVER_NAME}/$1 [R=301,L]

  DocumentRoot /var/www/html/RunPayway
</VirtualHost>

<VirtualHost *:443>
  ServerName runpayway.peoplestar.com
  ServerAlias runpayway.peoplestar.com

  SSLEngine on
  SSLCertificateFile /etc/ssl/certs/runpayway.crt
  SSLCertificateKeyFile /etc/ssl/private/runpayway.key
  SSLCertificateChainFile /etc/ssl/certs/runpayway.ca

  ProxyPreserveHost On
  ProxyPass / http://localhost:3000/
  ProxyPassReverse / http://localhost:3000/

  RewriteEngine On
  RewriteCond %{HTTP:Upgrade} websocket [NC]
  RewriteCond %{HTTP:Connection} upgrade [NC]
  RewriteRule ^/?(.*) "ws://localhost:3000/$1" [P,L]

  DocumentRoot /var/www/html/RunPayway
  <Directory /var/www/html/RunPayway>
    AllowOverride All
    Require all granted
  </Directory>
</VirtualHost>
