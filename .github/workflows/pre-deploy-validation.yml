name: Pre-Deployment Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Node version
        run: node --version && npm --version

      - name: Validate package.json syntax
        run: |
          echo "Validating package.json..."
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))" && echo "✅ package.json is valid"

      - name: Validate tsconfig.json syntax
        run: |
          echo "Validating tsconfig.json..."
          node -e "JSON.parse(require('fs').readFileSync('tsconfig.json', 'utf8'))" && echo "✅ tsconfig.json is valid"

      - name: Validate next.config.js syntax
        run: |
          echo "Validating next.config.js..."
          node next.config.js && echo "✅ next.config.js is valid"

      - name: Check critical files exist
        run: |
          echo "Checking critical files..."
          files=("package.json" "next.config.js" "tsconfig.json" "public/favicon.ico" "src/app/layout.tsx")
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ Found: $file"
            else
              echo "❌ Missing: $file"
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Check for security vulnerabilities
        run: npm audit --audit-level=moderate || true

      - name: Validate critical API routes exist
        run: |
          echo "Checking API routes..."
          routes=("src/app/api/health/route.ts" "src/app/api/v1" "src/app/api/verify")
          for route in "${routes[@]}"; do
            if [ -e "$route" ]; then
              echo "✅ Found: $route"
            else
              echo "⚠️ Warning: $route not found (may be expected)"
            fi
          done

      - name: Validate environment variables required
        run: |
          echo "Checking environment variable requirements..."
          echo "Required: GEMINI_API_KEY, NEXT_PUBLIC_STRIPE_CHECKOUT_URL"
          # Note: Secrets are not available in PR context, but workflow will validate during deploy

      - name: Build Next.js
        run: |
          echo "Building Next.js application..."
          npm run build
          if [ ! -d ".next" ]; then
            echo "❌ Error: .next directory not created during build"
            exit 1
          fi
          echo "✅ Build successful"

      - name: Verify build artifacts
        run: |
          echo "Verifying build artifacts..."
          required_dirs=(".next" "public" "src")
          for dir in "${required_dirs[@]}"; do
            if [ -d "$dir" ]; then
              echo "✅ Directory exists: $dir"
            else
              echo "❌ Missing directory: $dir"
              exit 1
            fi
          done

      - name: Check build size
        run: |
          echo "Checking build size..."
          build_size=$(du -sh .next | cut -f1)
          echo "Build size: $build_size"
          if du -s .next | awk '{exit $1 > 524288}'; then
            echo "✅ Build size acceptable"
          else
            echo "⚠️ Warning: Build size > 500MB"
          fi

      - name: Validate deployment script
        run: |
          echo "Validating deployment script..."
          if [ -f "deploy/validate-deployment.sh" ]; then
            bash -n deploy/validate-deployment.sh && echo "✅ Deployment script syntax valid"
          else
            echo "⚠️ Warning: deploy/validate-deployment.sh not found"
          fi

      - name: Summary
        run: |
          echo ""
          echo "========================================"
          echo "✅ Pre-Deployment Validation Passed"
          echo "========================================"
          echo ""
          echo "Checks Completed:"
          echo "  ✅ Node.js version"
          echo "  ✅ package.json syntax"
          echo "  ✅ tsconfig.json syntax"
          echo "  ✅ next.config.js syntax"
          echo "  ✅ Critical files present"
          echo "  ✅ Dependencies installable"
          echo "  ✅ Build successful"
          echo "  ✅ Build artifacts present"
          echo "  ✅ Deployment script valid"
          echo ""
          echo "Ready for production deployment!"
