name: Deploy to DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy code
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          REMOTE_HOST: 64.227.108.128
          REMOTE_USER: root
          SOURCE: ./
          TARGET: /var/www/html/RunPayway/
          EXCLUDE: >-
            .git/,
            .github/,
            .DS_Store,
            node_modules/,
            out/

      - name: Run deploy script
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 64.227.108.128
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            bash /var/www/html/RunPayway/scripts/deploy.sh
