name: Deploy to DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Test SSH Connection
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.DO_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_rsa
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/id_rsa
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o ConnectTimeout=10 root@64.227.108.128 "echo '✓ SSH connection successful'"

      - name: Upload Application Files
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.DO_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "Ensuring app directory exists..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no root@64.227.108.128 "mkdir -p /var/www/html/RunPayway"

          echo "Uploading application files..."
          scp -r -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            .next \
            public \
            src \
            package.json \
            package-lock.json \
            next.config.js \
            tsconfig.json \
            postcss.config.mjs \
            tailwind.config.ts \
            scripts \
            worker \
            root@64.227.108.128:/var/www/html/RunPayway/

      - name: Install Dependencies and Restart Application
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.DO_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "Cleaning corrupted node_modules on server..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no root@64.227.108.128 \
            "cd /var/www/html/RunPayway && rm -rf node_modules && npm cache clean --force"

          echo "Installing production dependencies on server..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no root@64.227.108.128 \
            "cd /var/www/html/RunPayway && npm ci --omit=dev"

          echo "Restarting application with PM2..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no root@64.227.108.128 \
            "pm2 restart runpayway || (pm2 start 'npm start' --name runpayway -- -p 3000 && pm2 save)"

          sleep 3

          echo "Checking PM2 status..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no root@64.227.108.128 "pm2 status"

      - name: Verify Application
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.DO_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "Verifying application on localhost:3000..."
          LOCAL_RESPONSE=$(ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no root@64.227.108.128 "curl -s http://127.0.0.1:3000/")
          if echo "$LOCAL_RESPONSE" | grep -q "Income can appear stable"; then
            echo "✓ localhost:3000 verified"
          else
            echo "✗ localhost:3000 failed verification"
            exit 1
          fi

          echo "Verifying application on https://runpayway.peoplestar.com..."
          LIVE_RESPONSE=$(curl -s https://runpayway.peoplestar.com/)
          if echo "$LIVE_RESPONSE" | grep -q "Income can appear stable"; then
            echo "✓ https://runpayway.peoplestar.com verified"
          else
            echo "✗ https://runpayway.peoplestar.com failed verification"
            exit 1
          fi

          echo ""
          echo "✓ DEPLOYMENT SUCCESSFUL"
          echo "App running at: https://runpayway.peoplestar.com"
