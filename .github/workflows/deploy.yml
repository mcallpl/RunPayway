name: Deploy to DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Deploy built app
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          REMOTE_HOST: 64.227.108.128
          REMOTE_USER: root
          SOURCE: ./
          TARGET: /var/www/html/RunPayway/
          EXCLUDE: >-
            .git/,
            .github/,
            .DS_Store,
            node_modules/,
            out/,
            src/,
            .next/.cache/,
            .env*

      - name: Run deploy script
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 64.227.108.128
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            bash /var/www/html/RunPayway/scripts/deploy.sh

      - name: Configure Apache for /RunPayway/
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 64.227.108.128
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            set -e
            APACHE_CONF="/etc/apache2/sites-enabled/000-default.conf"
            BACKUP="${APACHE_CONF}.bak.$(date +%s)"

            echo "=== Backing up Apache config ==="
            cp "$APACHE_CONF" "$BACKUP"
            echo "Backup: $BACKUP"

            echo "=== Enabling proxy modules ==="
            a2enmod proxy proxy_http proxy_wstunnel headers rewrite 2>&1 | grep -E "Enabling|already"

            echo "=== Checking for /RunPayway/ ProxyPass ==="
            if grep -q "ProxyPass /RunPayway/" "$APACHE_CONF"; then
              echo "✓ ProxyPass exists, correcting routing (strip /RunPayway/ from destination)..."
              sed -i 's|ProxyPass /RunPayway/ http://127\.0\.0\.1:3000/RunPayway/|ProxyPass /RunPayway/ http://127.0.0.1:3000/|g' "$APACHE_CONF"
              sed -i 's|ProxyPassReverse /RunPayway/ http://127\.0\.0\.1:3000/RunPayway/|ProxyPassReverse /RunPayway/ http://127.0.0.1:3000/|g' "$APACHE_CONF"
              echo "✓ Routing corrected"
            else
              echo "→ Adding ProxyPass directives for /RunPayway/..."
              # Insert ProxyPass directives before closing </VirtualHost>
              sed -i '/<\/VirtualHost>/i\	ProxyPreserveHost On\n	ProxyPass /RunPayway/ http://127.0.0.1:3000/\n	ProxyPassReverse /RunPayway/ http://127.0.0.1:3000/' "$APACHE_CONF"
              echo "✓ Directives added"
            fi

            echo "=== Testing Apache config ==="
            if apache2ctl configtest 2>&1; then
              echo "✓ Config valid"
              echo "→ Reloading Apache..."
              systemctl reload apache2
              sleep 2
              echo "✓ Reloaded"
            else
              echo "✗ Config test failed"
              echo "→ Restoring backup..."
              cp "$BACKUP" "$APACHE_CONF"
              exit 1
            fi

            echo "=== Testing direct app (port 3000 root) ==="
            curl -s http://127.0.0.1:3000/ | grep -o "Structural Exposure\|Additional sections" | head -10

            echo "=== Testing public URL through Apache ==="
            sleep 2
            curl -sL https://peoplestar.com/RunPayway/ | grep -o "Structural Exposure\|Additional sections" | head -10

      - name: Diagnostic - Test app directly vs Apache proxy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 64.227.108.128
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            echo "=== 1. Direct app on port 3000 with /RunPayway/ path ==="
            curl -s http://127.0.0.1:3000/RunPayway/ | grep -o "Structural Exposure\|Additional sections" | head -10
            echo ""
            echo "=== 2. Direct app on port 3000 with / path ==="
            curl -s http://127.0.0.1:3000/ | grep -o "Structural Exposure\|Additional sections" | head -10
            echo ""
            echo "=== 3. Public URL through Apache proxy ==="
            curl -s https://peoplestar.com/RunPayway/ | grep -o "Structural Exposure\|Additional sections" | head -10

      - name: Diagnostic - Check PM2 and routing
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 64.227.108.128
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            echo "=== PWD ==="
            pwd
            echo "=== PM2 LIST ==="
            pm2 list
            echo "=== PM2 SHOW RUNPAYWAY ==="
            pm2 show runpayway
            echo "=== PM2 LOGS (last 50 lines) ==="
            pm2 logs runpayway --nostream --lines 50
            echo "=== LISTENING PORTS (3000/3001/node/next) ==="
            ss -tulpn | grep -E "3000|3001|node|next" || echo "No matches found"
            echo "=== CURL localhost:3000/RunPayway/ ==="
            curl -s http://localhost:3000/RunPayway/ | grep -o "Structural Exposure\|Additional sections" | head -10 || echo "No match or curl failed"
            echo "=== CURL localhost:3000/ ==="
            curl -s http://localhost:3000/ | grep -o "Structural Exposure\|Additional sections" | head -10 || echo "No match or curl failed"
            echo "=== NGINX CONFIG (RunPayway/proxy_pass/3000/3001) ==="
            nginx -T 2>/dev/null | grep -A 20 -B 10 "RunPayway\|proxy_pass\|3000\|3001" || echo "No nginx config found"
