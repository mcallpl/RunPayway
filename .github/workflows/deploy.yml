name: Deploy to DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Test SSH Connection
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.DO_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_rsa
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/id_rsa
          echo "Testing SSH connection..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o ConnectTimeout=10 root@64.227.108.128 "echo '✓ SSH connection successful'"

      - name: Deploy to Server
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.DO_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "Creating deployment directory..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no root@64.227.108.128 "rm -rf /var/www/html/RunPayway && mkdir -p /var/www/html/RunPayway"

          echo "Transferring project files..."
          scp -r -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            .next \
            node_modules \
            public \
            src \
            package.json \
            package-lock.json \
            next.config.js \
            tsconfig.json \
            postcss.config.mjs \
            tailwind.config.ts \
            scripts \
            worker \
            root@64.227.108.128:/var/www/html/RunPayway/

          echo "✓ Project files deployed"

      - name: Configure Apache & Start Application
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.DO_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "Enabling Apache proxy modules..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no root@64.227.108.128 "a2enmod proxy && a2enmod proxy_http && a2enmod rewrite && a2enmod headers"

          echo "Configuring Apache VirtualHost..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no root@64.227.108.128 'cat > /etc/apache2/sites-available/runpayway.conf << "APACHE_EOF"
<VirtualHost *:443>
  ServerName runpayway.peoplestar.com
  ServerAlias runpayway.peoplestar.com

  SSLEngine on
  SSLCertificateFile /etc/ssl/certs/runpayway.crt
  SSLCertificateKeyFile /etc/ssl/private/runpayway.key

  ProxyPreserveHost On
  ProxyPass / http://localhost:3000/
  ProxyPassReverse / http://localhost:3000/

  RewriteEngine On
  RewriteCond %{HTTP:Upgrade} websocket [NC]
  RewriteCond %{HTTP:Connection} upgrade [NC]
  RewriteRule ^/?(.*) "ws://localhost:3000/$1" [P,L]

  DocumentRoot /var/www/html/RunPayway/public
  <Directory /var/www/html/RunPayway/public>
    AllowOverride All
    Require all granted
  </Directory>
</VirtualHost>

<VirtualHost *:80>
  ServerName runpayway.peoplestar.com
  ServerAlias runpayway.peoplestar.com

  RewriteEngine On
  RewriteCond %{HTTPS} !=on
  RewriteRule ^/?(.*) https://%{SERVER_NAME}/$1 [R,L]
</VirtualHost>
APACHE_EOF'

          echo "Enabling RunPayway site..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no root@64.227.108.128 "a2ensite runpayway.conf && a2dissite 000-default || true"

          echo "Testing Apache configuration..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no root@64.227.108.128 "apache2ctl configtest"

          echo "Restarting Apache..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no root@64.227.108.128 "systemctl restart apache2"

          echo "Installing PM2 globally..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no root@64.227.108.128 "npm install -g pm2"

          echo "Starting RunPayway with PM2..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no root@64.227.108.128 "cd /var/www/html/RunPayway && pm2 delete runpayway || true && pm2 start 'npm start' --name runpayway -- -p 3000 && pm2 save"

          sleep 2

          echo "Checking PM2 status..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no root@64.227.108.128 "pm2 status"

      - name: Verify Application
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.DO_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "Waiting for app to start..."
          sleep 3

          echo "Testing app on localhost:3000..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no root@64.227.108.128 "curl -s http://127.0.0.1:3000/ | head -c 200"

          echo ""
          echo ""
          echo "✓ FULL DEPLOYMENT SUCCESSFUL"
          echo "App running at: https://runpayway.peoplestar.com"
