name: Deploy to DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test SSH Connection
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 64.227.108.128
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          script: |
            echo "✓ SSH connection successful"
            whoami
            pwd

      - name: Deploy logo.png via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: 64.227.108.128
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          source: "public/logo.png"
          target: "/var/www/html/RunPayway/public/"

      - name: Verify file deployed
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 64.227.108.128
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          script: |
            echo "✓ Verifying logo.png on server..."
            ls -lh /var/www/html/RunPayway/public/logo.png
            file /var/www/html/RunPayway/public/logo.png
            echo "✓ File deployment successful"
