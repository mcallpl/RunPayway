name: Deploy to DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Deploy built app
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          REMOTE_HOST: 64.227.108.128
          REMOTE_USER: root
          SOURCE: ./
          TARGET: /var/www/html/RunPayway/
          EXCLUDE: >-
            .git/,
            .github/,
            .DS_Store,
            node_modules/,
            out/,
            src/,
            .next/.cache/,
            .env*

      - name: Run deploy script
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 64.227.108.128
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            bash /var/www/html/RunPayway/scripts/deploy.sh

      - name: Configure Apache for runpayway.peoplestar.com
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 64.227.108.128
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: bash /var/www/html/RunPayway/scripts/configure-apache.sh

      - name: Server Diagnostics - Check build and app state
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 64.227.108.128
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            cd /var/www/html/RunPayway
            echo "=== PWD ==="
            pwd
            echo ""
            echo "=== .next/server contents ==="
            ls -la .next/server | head
            echo ""
            echo "=== Search for missing 1331.js ==="
            find .next/server -name "1331.js" -o -name "*1331*"
            echo ""
            echo "=== Search for 'Structural Exposure' in build ==="
            grep -R "Structural Exposure" .next/server/app .next/server/pages 2>/dev/null | head -10
            echo ""
            echo "=== PM2 Status ==="
            pm2 status
            echo ""
            echo "=== PM2 Logs (last 80 lines) ==="
            pm2 logs runpayway --nostream --lines 80
            echo ""
            echo "=== HTTP Headers from localhost:3000 ==="
            curl -I http://127.0.0.1:3000/
            echo ""
            echo "=== Content from localhost:3000 (first 80 lines) ==="
            curl -s http://127.0.0.1:3000/ | head -80

      - name: Diagnostic - Test app directly vs Apache proxy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 64.227.108.128
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            echo "=== 1. Direct app on port 3000 (root) ==="
            curl -s http://127.0.0.1:3000/ | grep -o "Structural Exposure\|Additional sections" | head -10
            echo ""
            echo "=== 2. Public URL through subdomain (https://runpayway.peoplestar.com) ==="
            curl -sL https://runpayway.peoplestar.com/ | grep -o "Structural Exposure\|Additional sections" | head -10
            echo ""
            echo "=== 3. Verify /RunPayway path redirects properly ==="
            curl -sL https://peoplestar.com/RunPayway/ | head -c 200

      - name: Diagnostic - Check PM2 and subdomain routing
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 64.227.108.128
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            echo "=== PWD ==="
            pwd
            echo "=== PM2 LIST ==="
            pm2 list
            echo "=== PM2 SHOW RUNPAYWAY ==="
            pm2 show runpayway
            echo "=== PM2 LOGS (last 50 lines) ==="
            pm2 logs runpayway --nostream --lines 50
            echo "=== LISTENING PORTS (3000) ==="
            ss -tulpn | grep -E "3000|node|next" || echo "No matches found"
            echo "=== CURL localhost:3000/ (direct to Next.js) ==="
            curl -s http://localhost:3000/ | grep -o "Structural Exposure\|Additional sections" | head -10 || echo "No match or curl failed"
            echo "=== APACHE VHOST CONFIG ==="
            cat /etc/apache2/sites-enabled/runpayway.conf 2>/dev/null || echo "Config not found"
