name: Deploy to DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Deploy built app
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          REMOTE_HOST: 64.227.108.128
          REMOTE_USER: root
          SOURCE: ./
          TARGET: /var/www/html/RunPayway/
          EXCLUDE: >-
            .git/,
            .github/,
            .DS_Store,
            node_modules/,
            out/,
            src/,
            .next/.cache/,
            .env*

      - name: Run deploy script
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 64.227.108.128
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            bash /var/www/html/RunPayway/scripts/deploy.sh

      - name: Configure Nginx for /RunPayway/
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 64.227.108.128
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            set -e
            NGINX_CONF="/etc/nginx/nginx.conf"
            BACKUP="${NGINX_CONF}.bak.$(date +%s)"

            echo "=== Backing up Nginx config ==="
            cp "$NGINX_CONF" "$BACKUP"
            echo "Backup: $BACKUP"

            echo "=== Checking for /RunPayway/ location ==="
            if grep -q "location /RunPayway/" "$NGINX_CONF"; then
              echo "✓ Already configured"
            else
              echo "→ Adding /RunPayway/ location block..."
              awk '/^[[:space:]]*location \/ \{/{
                print "    location /RunPayway/ {"
                print "        proxy_pass http://localhost:3000/;"
                print "        proxy_set_header Host $host;"
                print "        proxy_set_header X-Real-IP $remote_addr;"
                print "        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;"
                print "        proxy_set_header X-Forwarded-Proto $scheme;"
                print "    }"
              }
              {print}' "$NGINX_CONF" > "${NGINX_CONF}.tmp"
              mv "${NGINX_CONF}.tmp" "$NGINX_CONF"
              echo "✓ Block added"
            fi

            echo "=== Testing Nginx config ==="
            if nginx -t 2>&1; then
              echo "✓ Config valid"
              echo "→ Reloading Nginx..."
              systemctl reload nginx
              sleep 1
              echo "✓ Reloaded"
            else
              echo "✗ Config test failed"
              echo "→ Restoring backup..."
              cp "$BACKUP" "$NGINX_CONF"
              exit 1
            fi

            echo "=== Verifying live site ==="
            sleep 2
            curl -sL https://peoplestar.com/RunPayway/ | grep -o "Structural Exposure\|Additional sections" | head -10

      - name: Diagnostic - Check PM2 and routing
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 64.227.108.128
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            echo "=== PWD ==="
            pwd
            echo "=== PM2 LIST ==="
            pm2 list
            echo "=== PM2 SHOW RUNPAYWAY ==="
            pm2 show runpayway
            echo "=== PM2 LOGS (last 50 lines) ==="
            pm2 logs runpayway --nostream --lines 50
            echo "=== LISTENING PORTS (3000/3001/node/next) ==="
            ss -tulpn | grep -E "3000|3001|node|next" || echo "No matches found"
            echo "=== CURL localhost:3000/RunPayway/ ==="
            curl -s http://localhost:3000/RunPayway/ | grep -o "Structural Exposure\|Additional sections" | head -10 || echo "No match or curl failed"
            echo "=== CURL localhost:3000/ ==="
            curl -s http://localhost:3000/ | grep -o "Structural Exposure\|Additional sections" | head -10 || echo "No match or curl failed"
            echo "=== NGINX CONFIG (RunPayway/proxy_pass/3000/3001) ==="
            nginx -T 2>/dev/null | grep -A 20 -B 10 "RunPayway\|proxy_pass\|3000\|3001" || echo "No nginx config found"
